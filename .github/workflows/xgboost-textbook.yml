name: XGBoost textbook reference tests
on:
  pull_request:
    paths:
      - 'textbook/xgboost-first-principles/**'
  push:
    paths:
      - 'textbook/xgboost-first-principles/**'
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: textbook/xgboost-first-principles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python tools/grade.py --reference
